name: Funnel sync (per-tool repos)

on:
  push:
    branches: [main]
    paths:
      - 'public/tools.json'
      - 'public/og-*.png'
      - 'docs/shots/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/funnel-gen.py'
      - 'scripts/funnel-sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnel-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build the hub (funnel-gen needs dist/ for the runnable demos)
        run: |
          npm ci
          npm run build
      - name: Regenerate funnel content
        run: python scripts/funnel-gen.py
      - name: Push changes to the 15 per-tool repos
        run: python scripts/funnel-sync.py
        env:
          # Classic PAT with `repo` scope (or a fine-grained token with
          # contents:write + administration:write on the NavigatorsLab-* repos).
          GH_TOKEN: ${{ secrets.FUNNEL_TOKEN }}
