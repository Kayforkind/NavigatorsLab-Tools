name: Funnel sync (per-tool repos)

on:
  push:
    branches: [main]
    paths:
      - 'public/tools.json'
      - 'public/og-*.png'
      - 'docs/shots/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/funnel-gen.py'
      - 'scripts/funnel-sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnel-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Build the hub (funnel-gen needs dist/ for the runnable demos)
        run: |
          npm ci
          npm run build
      - name: Regenerate funnel content
        run: python scripts/funnel-gen.py
      - name: Push changes to the 15 per-tool repos
        run: python scripts/funnel-sync.py
        env:
          # Classic PAT with `repo` scope (or a fine-grained token with
          # contents:write + administration:write on the NavigatorsLab-* repos).
          GH_TOKEN: ${{ secrets.FUNNEL_TOKEN }}
