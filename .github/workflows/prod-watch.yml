name: Prod watch (weekly)

# Runs the two deep production probes + a route check for every tool page
# against the LIVE site, regenerates public/status.json, commits it, and
# deploys it — so /tools/status always shows fresh, honest verification data.
# Fails loudly if anything on production breaks.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prod-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (deep probes use a real browser)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Probe production (deep probes + routes)
        run: python scripts/update-status.py
      - name: Commit refreshed status
        run: |
          git config user.name "navigatorslab-bot"
          git config user.email "noreply@navigatorslab.com"
          git add public/status.json
          git diff --cached --quiet || git commit -m "chore: refresh prod status (weekly watch)"
          git push
      - name: Deploy refreshed status to production
        # The probes and status commit above are the point of the watch; the
        # Cloudflare redeploy is opportunistic. A missing/expired token must
        # skip the deploy with a notice instead of failing the whole watch
        # (probes ran, status committed — that work should still land).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — probes + status committed, skipping the Cloudflare redeploy."
            exit 0
          fi
          npm run build
          npm run deploy:stage
          cd deploy && npx wrangler deploy
