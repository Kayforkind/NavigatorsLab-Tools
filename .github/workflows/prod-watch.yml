name: Prod watch (weekly)

# Runs the two deep production probes + a route check for every tool page
# against the LIVE site, regenerates public/status.json, commits it, and
# deploys it — so /tools/status always shows fresh, honest verification data.
# Fails loudly if anything on production breaks.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prod-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (deep probes use a real browser)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Probe production (deep probes + routes)
        run: python scripts/update-status.py
      - name: Commit refreshed status
        run: |
          git config user.name "navigatorslab-bot"
          git config user.email "noreply@navigatorslab.com"
          git add public/status.json
          git diff --cached --quiet || git commit -m "chore: refresh prod status (weekly watch)"
          git push
      - name: Deploy refreshed status to production
        run: |
          npm run build
          mkdir -p deploy && cp -r dist deploy/tools && cp wrangler.tools.jsonc deploy/wrangler.jsonc && cp worker.js deploy/ && cp src/lib/mcp.ts deploy/
          cd deploy && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
