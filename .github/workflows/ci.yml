name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (prod)
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. EXIF fuzzing)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Generate test fixtures
        run: node scripts/make-fixtures.cjs
      - name: E2E (all 11 tools, byte-validated)
        run: |
          node scripts/serve.cjs &
          sleep 2
          node scripts/e2e.cjs
      - name: Security suite (network silence, exfil, storage, fuzz, headers, secrets)
        run: node scripts/security.cjs
      - name: Mobile overflow check
        run: node scripts/mobile-shot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/shots/
          retention-days: 7
