name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (prod)
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. EXIF fuzzing)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Generate test fixtures
        run: node scripts/make-fixtures.cjs
      # Serve at the PRODUCTION URL SHAPE (/tools/ subpath, secure headers on)
      # so base-URL bugs (e.g. engine scripts at /tess/ instead of /tools/tess/)
      # can never pass CI and still 404 on the live site.
      - name: E2E + security at production URL shape (subpath /tools/, hardened server)
        run: |
          BASE_PREFIX=tools SECURE_HEADERS=1 node scripts/serve.cjs &
          sleep 2
          node scripts/e2e.cjs
          node scripts/security.cjs
        env:
          E2E_BASE: http://localhost:5178/tools/
          SEC_BASE: http://localhost:5178/tools
      - name: Mobile overflow check
        run: node scripts/mobile-shot.cjs
        env:
          E2E_BASE: http://localhost:5178/tools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/shots/
          retention-days: 7
